<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ETN 1024 - Realidad Aumentada</title>
  <!-- Carga rápida de A-Frame y AR.js desde servidores alternativos -->
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #header-ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 999;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    #controls-ui {
      position: fixed;
      bottom: 20px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 999;
    }
    .btn-action {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    #btn-start {
      background-color: #2e7d32;
    }
  </style>
</head>
<body>

  <div id="header-ui">
    <div><strong>Estudiante:</strong> Caleb Ignacio Cabas Olivares</div>
    <div><strong>Tamaño:</strong> <span id="status-text">Normal</span></div>
  </div>

  <div id="controls-ui">
    <button id="btn-start" class="btn-action" style="display: none;">Activar Cámara</button>
    <button id="btn-size" class="btn-action">Cambiar tamaño</button>
  </div>

  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Tarjeta A: Hiro -> Cubo Azul -->
    <a-marker preset="hiro">
      <a-box id="cubo-azul" position="0 0.5 0" scale="1 1 1" color="#1E88E5"></a-box>
    </a-marker>

    <!-- Tarjeta B: Kanji -> Esfera Roja -->
    <a-marker preset="kanji">
      <a-sphere id="esfera-roja" position="0 0.6 0" radius="0.5" scale="1 1 1" color="#E53935"></a-sphere>
    </a-marker>

    
  </a-scene>

  <script>
    const btnSize = document.getElementById('btn-size');
    const btnStart = document.getElementById('btn-start');
    const statusText = document.getElementById('status-text');
    const cubo = document.getElementById('cubo-azul');
    const esfera = document.getElementById('esfera-roja');

    let isEnlarged = false;

    btnSize.addEventListener('click', () => {
      isEnlarged = !isEnlarged;
      const newScale = isEnlarged ? '1.5 1.5 1.5' : '1 1 1';
      cubo.setAttribute('scale', newScale);
      esfera.setAttribute('scale', newScale);
      statusText.textContent = isEnlarged ? 'Ampliado' : 'Normal';
    });

    // Botón manual si el navegador móvil pausa el video
    setTimeout(() => {
      const video = document.querySelector('video');
      if (video && video.paused) {
        btnStart.style.display = 'block';
      }
    }, 3000);

    btnStart.addEventListener('click', () => {
      const video = document.querySelector('video');
      if (video) {
        video.play();
        btnStart.style.display = 'none';
      }
    });
  </script>
</body>
</html>
