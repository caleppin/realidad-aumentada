<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ETN 1024 - Realidad Aumentada</title>
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    /* Fondo transparente obligatorio para que no tape la cámara */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }
    /* Orden de capas: Video (1) -> Figuras 3D (2) -> Botones (100) */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }
    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 2 !important;
    }
    #header-ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #121212;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 200;
      color: white;
      text-align: center;
      padding: 20px;
    }
    #btn-start {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
    }
    #controls-ui {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
    }
    #btn-size {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Pantalla inicial -->
  <div id="start-overlay">
    <p>Presiona el botón y acepta el permiso de cámara</p>
    <button id="btn-start">Encender Cámara</button>
    <p id="error-log" style="color: #ff8a80; font-size: 13px; margin-top: 15px;"></p>
  </div>

  <!-- Barra superior -->
  <div id="header-ui">
    <div><strong>Estudiante:</strong> Caleb Ignacio Cabas Olivares</div>
    <div><strong>Tamaño:</strong> <span id="status-text">Normal</span></div>
  </div>

  <!-- Botón de escala -->
  <div id="controls-ui">
    <button id="btn-size">Cambiar tamaño</button>
  </div>

  <!-- Contenedor donde se inyectará la cámara AR solo después del permiso -->
  <div id="ar-container"></div>

  <script>
    const btnStart = document.getElementById('btn-start');
    const startOverlay = document.getElementById('start-overlay');
    const errorLog = document.getElementById('error-log');
    const arContainer = document.getElementById('ar-container');
    const btnSize = document.getElementById('btn-size');
    const statusText = document.getElementById('status-text');

    let isEnlarged = false;

    btnStart.addEventListener('click', async () => {
      try {
        // 1. Pedir permiso primero y liberar el sensor
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'environment' } 
        });
        stream.getTracks().forEach(track => track.stop());

        // 2. Ocultar pantalla negra e iniciar AR.js con permiso ya concedido
        startOverlay.style.display = 'none';
        arContainer.innerHTML = `
          <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
            <a-marker preset="hiro">
              <a-box id="cubo-azul" position="0 0.5 0" scale="1 1 1" color="#1E88E5"></a-box>
            </a-marker>
            <a-marker preset="kanji">
              <a-sphere id="esfera-roja" position="0 0.6 0" radius="0.5" scale="1 1 1" color="#E53935"></a-sphere>
            </a-marker>
            
          </a-scene>
        `;
      } catch (err) {
        errorLog.textContent = 'No se pudo abrir la cámara: ' + err.message;
      }
    });

    btnSize.addEventListener('click', () => {
      const cubo = document.getElementById('cubo-azul');
      const esfera = document.getElementById('esfera-roja');
      if (!cubo || !esfera) return;

      isEnlarged = !isEnlarged;
      const newScale = isEnlarged ? '1.5 1.5 1.5' : '1 1 1';
      cubo.setAttribute('scale', newScale);
      esfera.setAttribute('scale', newScale);
      statusText.textContent = isEnlarged ? 'Ampliado' : 'Normal';
    });
  </script>
</body>
</html>
