<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tarjetas geométricas AR - ETN 1024</title>

  <!-- Versiones fijas de las bibliotecas (anotarlas en el informe) -->
  <!-- A-Frame 1.3.0 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js 3.4.5 (A-Frame, seguimiento de marcadores) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }

    /* Franja superior: nombre del estudiante */
    #nombre {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff; font: 600 15px/1.2 sans-serif;
      text-align: center;
      z-index: 10000; pointer-events: none;
    }

    /* Franja inferior: botón + estado (lejos del centro de seguimiento) */
    #controles {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; gap: 12px; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 10000;
    }
    #btnTamano {
      font: 600 16px sans-serif;
      padding: 12px 20px; border: 0; border-radius: 10px;
      background: #fff; color: #000;
    }
    #estado {
      color: #fff; font: 600 16px sans-serif; min-width: 90px;
    }
  </style>
</head>

<body>
  <!-- CAMBIA ESTE TEXTO por tu nombre -->
  <div id="nombre">Estudiante:CALEB CABAS-MIGUEL CARVAJAL-IVAN SOLARES — ETN 1024</div>

  <div id="controles">
    <button id="btnTamano" type="button">Cambiar tamaño</button>
    <span id="estado">Normal</span>
  </div>

  <!-- Escena: cámara trasera (webcam) + AR.js -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; precision: medium;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">

    <!-- TARJETA A: marcador Hiro -> CUBO AZUL -->
    <a-marker preset="hiro">
      <a-box id="figura-cubo"
             position="0 0.5 0"
             scale="1 1 1"
             color="#0000FF"></a-box>
    </a-marker>

    <!-- TARJETA B: marcador Kanji -> ESFERA ROJA -->
    <a-marker preset="kanji">
      <a-sphere id="figura-esfera"
                position="0 0.5 0"
                radius="0.5"
                scale="1 1 1"
                color="#FF0000"></a-sphere>
    </a-marker>

    <!-- Cámara: sin ella las figuras no se ven. NO está asociada a las figuras -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Estado de tamaño común para ambas figuras
    const ESCALA_NORMAL = 1.0;
    const ESCALA_AMPLIADA = 1.5;   // +50 %
    let ampliado = false;

    const cubo = document.getElementById('figura-cubo');
    const esfera = document.getElementById('figura-esfera');
    const etiqueta = document.getElementById('estado');
    const boton = document.getElementById('btnTamano');

    function aplicarTamano() {
      const s = ampliado ? ESCALA_AMPLIADA : ESCALA_NORMAL;
      const valor = s + ' ' + s + ' ' + s;
      cubo.setAttribute('scale', valor);
      esfera.setAttribute('scale', valor);
      etiqueta.textContent = ampliado ? 'Ampliado' : 'Normal';
    }

    boton.addEventListener('click', function () {
      ampliado = !ampliado;
      aplicarTamano();
    });

    aplicarTamano(); // estado inicial: Normal
  </script>
</body>
</html>
