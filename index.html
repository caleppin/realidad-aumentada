<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ETN 1024 - Realidad Aumentada</title>
  <script src="https://aframe.io"></script>
  <script src="https://jsdelivr.net"></script>
  <style>
    /* Evita que el fondo blanco tape el video de la cámara */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent !important;
      font-family: Arial, sans-serif;
    }

    /* Fuerza el video de la cámara al frente del fondo y detrás del 3D */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }

    /* Lienzo 3D transparente sobre el video */
    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 2 !important;
    }

    /* Interfaz superior */
    #header-ui {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 100;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    /* Botón inferior */
    #controls-ui {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
    }

    #btn-size {
      background-color: #0056b3;
      color: white;
      border: none;
      padding: 14px 26px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="header-ui">
    <div><strong>Estudiante:</strong> Caleb Ignacio Cabas Olivares</div>
    <div><strong>Tamaño:</strong> <span id="status-text">Normal</span></div>
  </div>

  <div id="controls-ui">
    <button id="btn-size">Cambiar tamaño</button>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded 
           vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Tarjeta A: Hiro -> Cubo Azul -->
    <a-marker preset="hiro">
      <a-box id="cubo-azul" position="0 0.5 0" scale="1 1 1" color="#1E88E5"></a-box>
    </a-marker>

    <!-- Tarjeta B: Kanji -> Esfera Roja -->
    <a-marker preset="kanji">
      <a-sphere id="esfera-roja" position="0 0.6 0" radius="0.5" scale="1 1 1" color="#E53935"></a-sphere>
    </a-marker>

    
  </a-scene>

  <script>
    const btnSize = document.getElementById('btn-size');
    const statusText = document.getElementById('status-text');
    const cubo = document.getElementById('cubo-azul');
    const esfera = document.getElementById('esfera-roja');

    let isEnlarged = false;

    btnSize.addEventListener('click', () => {
      isEnlarged = !isEnlarged;
      const newScale = isEnlarged ? '1.5 1.5 1.5' : '1 1 1';
      cubo.setAttribute('scale', newScale);
      esfera.setAttribute('scale', newScale);
      statusText.textContent = isEnlarged ? 'Ampliado' : 'Normal';
    });

    // Asegura reproducción de video en dispositivos Android/Huawei
    window.addEventListener('arjs-video-loaded', () => {
      const video = document.querySelector('video');
      if (video && video.paused) {
        video.play();
      }
    });
  </script>
</body>
</html>
